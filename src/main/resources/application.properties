spring.application.name=Kfpcl
server.port=9000

# ── PostgreSQL Database Configuration ──────────────────────────────────────────
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:kfpcl_db121}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:123}
spring.datasource.driver-class-name=org.postgresql.Driver

# ── JPA / Hibernate Settings ──────────────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=true
spring.jackson.time-zone=Asia/Kolkata
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Kolkata

# ── Jackson JSON Serialization Settings ────────────────────────────────────────
spring.jackson.serialization.FAIL_ON_EMPTY_BEANS=false

# ── Server & Response Settings ────────────────────────────────────────────────
server.address=0.0.0.0
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:*}

spring.mvc.contentnegotiation.favor-parameter=true
spring.mvc.contentnegotiation.ignore-accept-header=true
spring.mvc.contentnegotiation.default-content-type=application/json

server.compression.enabled=true
server.compression.mime-types=application/json,application/*+json
server.compression.min-response-size=1024
