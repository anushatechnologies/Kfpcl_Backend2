spring.application.name=Anusha

# ── Super Admin Bootstrap ────────────────────────────────────────────────────
# Set these env vars the FIRST time you start the server (only needed once).
# After the super admin is created, these can be left blank or removed.
bootstrap.superadmin.email=${BOOTSTRAP_SUPERADMIN_EMAIL:}
bootstrap.superadmin.password=${BOOTSTRAP_SUPERADMIN_PASSWORD:}
bootstrap.superadmin.name=${BOOTSTRAP_SUPERADMIN_NAME:Super Admin}
server.port=9000

#
#spring.datasource.url=jdbc:mysql://localhost:3306/anusha?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
#spring.datasource.username=root
#spring.datasource.password=2395
#spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# AWS RDS - Hyderabad Region
spring.datasource.url=jdbc:mysql://${DB_HOST:your-rds-endpoint}:${DB_PORT:3306}/${DB_NAME:anushabazaar-db}
spring.datasource.username=${DB_USER:your-db-user}
spring.datasource.password=${DB_PASSWORD:your-db-password}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

firebase.service-account-path=classpath:anushadeliverypartnerapp-firebase-adminsdk.json
firebase.database-url=https://anushabazaar-2288e-default-rtdb.firebaseio.com

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=true
spring.jackson.time-zone=Asia/Kolkata
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Kolkata

server.address=0.0.0.0

# Extra CORS origins for frontend deployments. Comma-separated full origins, no trailing slash.
# Example: https://admin.example.com,https://app.example.com
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:}

# File upload
spring.servlet.multipart.max-file-size=${MAX_FILE_SIZE:100MB}
spring.servlet.multipart.max-request-size=${MAX_REQUEST_SIZE:120MB}

spring.thymeleaf.cache=false
spring.thymeleaf.check-template-location=false

# ── Referral / scratch card config ───────────────────────────────────────────
# Public-facing share link domain. The customer app deep links from this URL.
app.referral.share-link-base=${REFERRAL_SHARE_LINK_BASE:https://app.anushatechnologies.com/r/}
# Brand name used in WhatsApp share message ("Try <brand>! Use my code …")
app.referral.brand-name=${REFERRAL_BRAND_NAME:Anusha Bazaar}
# Android Play Store package id (used by /r/{code} redirect page when app not installed)
app.referral.android-package=${REFERRAL_ANDROID_PACKAGE:com.anusha.deliveryapp}
# iOS App Store URL (optional)
app.referral.ios-store-url=${REFERRAL_IOS_STORE_URL:}

# Firebase Web API Key — used by the Identity Toolkit REST API to send emails.
# Get it from Firebase Console → Project Settings → General → Web API Key.
firebase.web-api-key=${FIREBASE_WEB_API_KEY:}

# Admin panel + mail delivery
app.admin-panel.base-url=${ADMIN_PANEL_BASE_URL:https://admin.anushatechnologies.com}
app.mail.from=${MAIL_FROM:admin@anushatechnologies.com}
app.mail.from-name=${MAIL_FROM_NAME:Anusha Bazaar}
app.mail.reply-to=${MAIL_REPLY_TO:admin@anushatechnologies.com}

spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS:true}
spring.mail.properties.mail.smtp.starttls.required=${MAIL_SMTP_STARTTLS_REQUIRED:false}
spring.mail.properties.mail.smtp.ssl.enable=${MAIL_SMTP_SSL_ENABLE:false}
spring.mail.properties.mail.smtp.ssl.trust=${MAIL_SMTP_TRUST:}
spring.mail.properties.mail.smtp.ssl.protocols=${MAIL_SMTP_SSL_PROTOCOLS:TLSv1.2 TLSv1.3}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=15000
spring.mail.properties.mail.smtp.writetimeout=15000

# AWS S3 - Hyderabad Region
aws.access-key-id=${AWS_ACCESS_KEY_ID:YOUR_ACCESS_KEY}
aws.secret-access-key=${AWS_SECRET_ACCESS_KEY:YOUR_SECRET_KEY}
aws.region=${AWS_REGION:ap-south-2}
aws.s3.bucket-name=${AWS_S3_BUCKET:anusha-images-prod}
logging.level.com.amazonaws=DEBUG
# Force JSON responses (prevents XML parsing errors in frontend)
spring.mvc.contentnegotiation.favor-parameter=true
spring.mvc.contentnegotiation.ignore-accept-header=true
spring.mvc.contentnegotiation.default-content-type=application/json

# Compress JSON API responses to reduce product listing payload size.
server.compression.enabled=true
server.compression.mime-types=application/json,application/*+json
server.compression.min-response-size=1024

# WhatsApp API (Meta Business Suite)
whatsapp.api.url=https://graph.facebook.com/v22.0
whatsapp.api.token=${WHATSAPP_API_TOKEN:}
whatsapp.phone-number-id=${WHATSAPP_PHONE_NUMBER_ID:}
whatsapp.waba-id=${WHATSAPP_WABA_ID:}
whatsapp.template-language-code=${WHATSAPP_TEMPLATE_LANGUAGE_CODE:en}
whatsapp.verify-token=${WHATSAPP_VERIFY_TOKEN:ANUSHA_SECRET_TOKEN}
whatsapp.customer-order-confirmed-template=${WHATSAPP_CUSTOMER_ORDER_CONFIRMED_TEMPLATE:customer_order_confirmed}

# Paid orders are auto-confirmed and sent to the operator via WhatsApp.
app.orders.operator-whatsapp=${ORDER_OPERATOR_WHATSAPP:919948598350}
app.orders.auto-fulfill-on-paid=${AUTO_FULFILL_ON_PAID:true}
whatsapp.order-notification-template=${WHATSAPP_ORDER_TEMPLATE:order_notification_v2}
